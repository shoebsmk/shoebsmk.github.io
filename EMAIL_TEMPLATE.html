<!-- 
  EmailJS Email Template HTML
  Copy this entire HTML code and paste it into your EmailJS template editor
  Make sure to set the Subject line and Reply-To fields as shown below
-->

<div style="font-family: system-ui, sans-serif, Arial; font-size: 14px; line-height: 1.6; color: #2d3748;">
  <div style="margin-bottom: 20px;">
    <h2 style="color: #4c51bf; margin: 0 0 10px 0; font-size: 20px;">New Contact Form Submission</h2>
    <p style="margin: 0; color: #666;">A message from <strong>{{from_name}}</strong> has been received. Kindly respond at your earliest convenience.</p>
  </div>
  
  <div style="margin-top: 20px; padding: 20px 0; border-width: 1px 0; border-style: dashed; border-color: #e2e8f0;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="vertical-align: top; padding-right: 15px;">
          <div style="padding: 8px 12px; background-color: #eef2ff; border-radius: 8px; font-size: 28px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;" role="img">
            👤
          </div>
        </td>
        <td style="vertical-align: top; width: 100%;">
          <div style="color: #2d3748; font-size: 18px; font-weight: 600; margin-bottom: 5px;">
            <strong>{{from_name}}</strong>
          </div>
          <div style="color: #718096; font-size: 13px; margin-bottom: 15px;">
            📧 {{from_email}}
          </div>
        </td>
      </tr>
    </table>
  </div>

  <div style="margin-top: 20px; padding: 20px; background-color: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;">
    <div style="color: #4c51bf; font-size: 16px; font-weight: 600; margin-bottom: 12px;">
      Message:
    </div>
    <div style="color: #2d3748; font-size: 15px; line-height: 1.8; white-space: pre-wrap;">
      {{message}}
    </div>
  </div>

  <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0; text-align: center; color: #718096; font-size: 12px;">
    <p style="margin: 0;">This email was sent from your portfolio contact form.</p>
    <p style="margin: 5px 0 0 0;">Reply directly to this email to respond to {{from_name}}.</p>
  </div>
</div>

<!-- 
  EMAILJS TEMPLATE SETTINGS:
  
  Subject Line:
  New Contact Form Submission from {{from_name}}
  
  Reply-To:
  {{from_email}}
  
  To:
  {{to_email}}
  
  Variables used:
  - {{from_name}} - Sender's name
  - {{from_email}} - Sender's email address
  - {{message}} - Message content
  - {{to_email}} - Your email address (shoebwm@gmail.com)
-->
