<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Me | Shoeb Khan</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/31149d48b0.js" crossorigin="anonymous"></script>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/styles/input.css">
</head>
<body>
    <nav class="navbar fixed top-0 w-full z-[1000] py-6 transition-all duration-300">
        <div class="container max-w-7xl mx-auto px-5 flex justify-between items-center">
            <a class="back-button inline-flex items-center gap-2 px-4 py-2 bg-white/10 border border-white/20 rounded-full text-sm md:text-base font-medium transition-all duration-300 hover:bg-white/20 hover:-translate-x-1" href="index.html">
                <i class="fas fa-arrow-left text-sm"></i> Back
            </a>
            <div class="menu-toggle md:hidden cursor-pointer absolute right-5 top-1/2 -translate-y-1/2 z-[1001]" id="mobile-menu">
                <span class="bar block w-6 h-0.5 my-1.5 transition-all duration-300 bg-white"></span>
                <span class="bar block w-6 h-0.5 my-1.5 transition-all duration-300 bg-white"></span>
                <span class="bar block w-6 h-0.5 my-1.5 transition-all duration-300 bg-white"></span>
            </div>
            <ul class="nav-links hidden md:flex gap-8">
                <li><a class="nav-link font-medium relative after:content-[''] after:absolute after:w-0 after:h-0.5 after:bottom-[-5px] after:left-0 after:bg-accent after:transition-all after:duration-300 hover:after:w-full" href="index.html#home">Home</a></li>
                <li><a class="nav-link font-medium relative after:content-[''] after:absolute after:w-0 after:h-0.5 after:bottom-[-5px] after:left-0 after:bg-accent after:transition-all after:duration-300 hover:after:w-full" href="index.html#about">About</a></li>
                <li><a class="nav-link font-medium relative after:content-[''] after:absolute after:w-0 after:h-0.5 after:bottom-[-5px] after:left-0 after:bg-accent after:transition-all after:duration-300 hover:after:w-full" href="index.html#services">Services</a></li>
                <li><a class="nav-link font-medium relative after:content-[''] after:absolute after:w-0 after:h-0.5 after:bottom-[-5px] after:left-0 after:bg-accent after:transition-all after:duration-300 hover:after:w-full" href="index.html#experience">Experience</a></li>
                <li><a class="nav-link font-medium relative after:content-[''] after:absolute after:w-0 after:h-0.5 after:bottom-[-5px] after:left-0 after:bg-accent after:transition-all after:duration-300 hover:after:w-full" href="projects.html">Projects</a></li>
            </ul>
        </div>
    </nav>

    <section id="contact-page" class="pt-32 min-h-[calc(100vh-100px)] py-24">
        <div class="container max-w-7xl mx-auto px-5">
            <h1 class="section-title text-4xl text-center mb-12 relative inline-block left-1/2 -translate-x-1/2 after:content-[''] after:block after:w-16 after:h-1 after:bg-accent after:mx-auto after:mt-2.5 after:rounded">Contact Me</h1>
            <div class="glass-card max-w-3xl mx-auto">
                <form id="contactForm" class="space-y-6">
                    <div>
                        <label for="name" class="block mb-2 font-semibold">Name</label>
                        <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-lg border border-white/20 bg-white/15 text-white placeholder:text-white/50 focus:outline-none focus:border-white/35 transition-colors duration-150">
                    </div>
                    <div>
                        <label for="email" class="block mb-2 font-semibold">Email</label>
                        <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-white/20 bg-white/15 text-white placeholder:text-white/50 focus:outline-none focus:border-white/35 transition-colors duration-150">
                    </div>
                    <div>
                        <label for="phone" class="block mb-2 font-semibold">Phone</label>
                        <input type="tel" id="phone" name="phone" class="w-full px-4 py-3 rounded-lg border border-white/20 bg-white/15 text-white placeholder:text-white/50 focus:outline-none focus:border-white/35 transition-colors duration-150">
                    </div>
                    <div>
                        <label for="reason" class="block mb-2 font-semibold">Reason for Contact</label>
                        <select id="reason" name="reason" class="w-full px-4 py-3 rounded-lg border border-white/20 bg-white/15 text-white focus:outline-none focus:border-white/35 transition-colors duration-150">
                            <option value="Consultation">Consultation</option>
                            <option value="Work Opportunity">Work Opportunity</option>
                            <option value="Education">Education</option>
                            <option value="Collaboration">Collaboration</option>
                            <option value="Other">Other:</option>
                        </select>
                    </div>
                    <div id="reasonOtherRow" class="hidden">
                        <label for="reasonOther" class="block mb-2 font-semibold">Please specify</label>
                        <input type="text" id="reasonOther" name="reasonOther" class="w-full px-4 py-3 rounded-lg border border-white/20 bg-white/15 text-white placeholder:text-white/50 focus:outline-none focus:border-white/35 transition-colors duration-150">
                    </div>
                    <div class="flex justify-end gap-4">
                        <button type="submit" class="btn-glass-lg">Send</button>
                        <a href="https://docs.google.com/forms/d/e/1FAIpQLSd497S-AAUDH1TarJCQetLt4YiHpVozHfD4dbVpg4Jsb358JQ/viewform" target="_blank" class="btn-glass-sm">Open Google Form</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
